<svg class="dag" xmlns="http://www.w3.org/2000/svg" viewBox="-4 20 548 380" role="img" aria-labelledby="dag-title dag-desc">
  <title id="dag-title">Every arrow across a codebase</title>
  <desc id="dag-desc">A directed graph: one high-level design fans out to three low-level designs, six requirements, six tests written first, and five code files. Two highlighted edges show one test covering two code files and one code file covered by two tests.</desc>
  <!-- Every filled rect stays at least 70 by 30 viewBox units: smaller filled rects hit a
       Firefox Android paint bug where the fill never draws until a hard reload. -->
  <defs>
    <marker id="dag-arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="5" markerHeight="5" orient="auto" markerUnits="userSpaceOnUse"><path class="dag-head" d="M0 1L8 4L0 7z"/></marker>
    <marker id="dag-arrow-cross" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto" markerUnits="userSpaceOnUse"><path class="dag-head-cross" d="M0 1L8 4L0 7z"/></marker>
  </defs>
