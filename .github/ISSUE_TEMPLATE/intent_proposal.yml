name: Intent change / proposal
description: Propose new or changed intent — a methodology change, a feature, or a refinement to walk through the arrow.
title: "[intent]: "
body:
  - type: markdown
    attributes:
      value: |
        This repository is LID-on-LID — changes walk the arrow (HLD → LLD → EARS → tests → code). Frame the *what* and *why* here; the cascade happens in the PR. For open-ended questions, use [Discussions](https://github.com/jszmajda/lid/discussions) instead.
  - type: textarea
    id: context
    attributes:
      label: Context / Problem
      description: What's wrong or missing today, and why does it matter?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What should change?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: A checklist of what "done" looks like.
      value: |
        - [ ]
    validations:
      required: false
  - type: textarea
    id: scope
    attributes:
      label: Scope & non-goals
      description: What this deliberately does and does not cover.
    validations:
      required: false
  - type: textarea
    id: touchpoints
    attributes:
      label: Intent touchpoints (LID)
      description: "Optional — where in the intent tree this lands, if you know: which HLD section / LLD / EARS prefix, and whether it's novel intent. New to LID? Leave this blank and we'll map it during triage."
    validations:
      required: false
  - type: textarea
    id: related
    attributes:
      label: Related
      description: Related issues, PRs, or discussions.
    validations:
      required: false
